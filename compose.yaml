# podman compose up -d   (or podman-compose up -d)
services:
  yorkfolio:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/yorkfolio:latest
    container_name: yorkfolio
    ports:
      - "8000:8000"
    volumes:
      - yorkfolio-data:/data
    restart: unless-stopped

volumes:
  yorkfolio-data:
    name: yorkfolio-data  # same volume as `make up` / `make service`
